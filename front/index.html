<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Back/Front</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="main.js"></script>
</head>
<body>
   <div x-data="showsComponent">
        <div x-data>
            <button @click="window.location='/films'">Films</button>
        </div>
        <div x-data>
            <button @click="window.location='/series'">Séries</button>
        </div>
        <div x-data>
            <button @click="window.location='/login'">Connexion</button>
        </div>

        <template x-if="loading">
            <p x-text="message"></p>
        </template>

        <template x-if="!loading">
            <template x-for="show in shows" :key="show.id">
            <div class="show">
                <h2 x-text="show.title || show.original_title || show.slug"></h2>
                <p x-text="show.description"></p>
                <img :src="show.images.poster" alt="" x-show="show.images.poster">
                <a :href="show.resource_url" target="_blank">Voir sur BetaSeries</a>
            </div>
        </template>
    </div>

</body>
</html>
